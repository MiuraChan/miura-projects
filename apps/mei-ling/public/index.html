<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/effects.css" />
  <link rel="stylesheet" href="/figma-portrait-motion.css" />
  <link rel="stylesheet" href="/expression-system.css" />
  <link rel="stylesheet" href="/conversation.css" />
  <link rel="stylesheet" href="/panels.css" />
  <title>CODEC // MEI LING</title>
</head>
<body>
  <main class="codec-stage" aria-label="MGS1 Codec">
    <section
      class="codec"
      data-state="idle"
      tabindex="0"
      role="button"
      aria-label="Chiama Mei Ling"
    >
      <figure class="portrait portrait--mei" data-node-id="12:111" data-expression="neutral">
        <img id="meiPortraitImage" class="portrait__image" src="/figma-mei-manga-approved.png" alt="Mei Ling" />
        <span class="phosphor"></span>
        <span class="scanlines"></span>
      </figure>

      <section class="radio" aria-label="Codec frequency">
        <div class="radio__top">P T T</div>
        <div class="radio__rail radio__rail--one"></div>
        <div class="radio__rail radio__rail--two"></div>
        <div class="signal" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <time id="clock" class="clock">19:03</time>
        <div class="radio__rail radio__rail--three"></div>
        <div class="radio__bottom">MEMORY</div>
        <span class="scanlines"></span>
      </section>

      <figure class="portrait portrait--miura" data-node-id="12:119">
        <img class="portrait__image" src="/figma-miura-manga-approved.png" alt="Miura" />
        <span class="phosphor"></span>
        <span class="scanlines"></span>
      </figure>
    </section>

    <button
      id="codecPanelHandle"
      class="codec-panel-handle"
      type="button"
      aria-controls="codecPanel"
      aria-expanded="false"
      aria-label="Apri le informazioni di Mei Ling"
    >
      <span aria-hidden="true">◀</span>
      <span class="sr-only">Apri pannelli</span>
    </button>

    <div id="codecPanelBackdrop" class="codec-panel-backdrop" aria-hidden="true"></div>
    <aside
      id="codecPanel"
      class="codec-panel"
      aria-label="Informazioni fornite da Mei Ling"
      aria-hidden="true"
      inert
    >
      <header class="codec-panel__header">
        <div>
          <span class="codec-panel__eyebrow">MEI LING // DATA LINK</span>
          <h2 id="codecPanelTitle">INTEL</h2>
        </div>
        <button
          id="codecPanelClose"
          class="codec-panel__close"
          type="button"
          aria-label="Nascondi i pannelli"
        >×</button>
      </header>

      <nav class="codec-panel__tabs" aria-label="Sezioni informative" role="tablist">
        <button id="intelTab" type="button" role="tab" aria-selected="true" aria-controls="intelPanel" data-panel-tab="intel">INTEL</button>
        <button id="debriefTab" type="button" role="tab" aria-selected="false" aria-controls="debriefPanel" tabindex="-1" data-panel-tab="debrief">DEBRIEF</button>
        <button id="memoryTab" type="button" role="tab" aria-selected="false" aria-controls="memoryPanel" tabindex="-1" data-panel-tab="memory">MEMORY</button>
      </nav>

      <div id="codecPanelSwipeGrip" class="codec-panel__swipe-grip" aria-hidden="true">
        <span></span>
      </div>

      <div class="codec-panel__viewport">
        <section id="intelPanel" class="codec-panel__section" role="tabpanel" aria-labelledby="intelTab" data-panel-section="intel">
          <div id="intelContent" class="codec-panel__content" aria-live="polite"></div>
        </section>
        <section id="debriefPanel" class="codec-panel__section" role="tabpanel" aria-labelledby="debriefTab" data-panel-section="debrief" hidden>
          <div id="debriefContent" class="codec-panel__content" aria-live="polite"></div>
        </section>
        <section id="memoryPanel" class="codec-panel__section" role="tabpanel" aria-labelledby="memoryTab" data-panel-section="memory" hidden>
          <div id="memoryContent" class="codec-panel__content" aria-live="polite"></div>
        </section>
      </div>

      <footer class="codec-panel__footer">
        <span>SWIPE ◀ ▶</span>
        <button id="codecPanelRefresh" type="button">SYNC</button>
      </footer>
    </aside>

    <p id="codecPanelStatus" class="sr-only" aria-live="polite"></p>

    <section id="codecTranscript" class="codec-transcript" aria-live="polite" hidden>
      <header class="codec-transcript__header">
        <span id="transcriptSpeaker">CODEC</span>
        <span id="callStatus">STANDBY</span>
      </header>
      <p id="transcriptText" class="codec-transcript__text"></p>
      <form id="messageForm" class="codec-text-form" hidden>
        <label class="sr-only" for="messageInput">Messaggio per Mei Ling</label>
        <input
          id="messageInput"
          name="message"
          type="text"
          maxlength="4000"
          autocomplete="off"
          placeholder="SCRIVI A MEI LING…"
        />
        <button type="submit">SEND</button>
      </form>
    </section>
  </main>
  <script type="module" src="/app.js?v=6"></script>
</body>
</html>
