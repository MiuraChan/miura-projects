prompt = "Ogni giorno cerca offerte di lavoro attive adatte a Francesco Saccullo e gestisci le candidature autorizzate dall'utente. Leggi C:/Users/miura/Documents/ChatGPT/mediakit sender/candidate-profile.md e verifica eventuali aggiornamenti del media kit https://francesco-saccullo-mediakit.web.app/ . Usa questo link pubblico nelle candidature. Il sito contiene il profilo professionale; richiedi un CV separato solo quando necessario per un portale. Cerca in tutto il mondo SOLO remoto o ibrido, escludendo la presenza integrale. Dai precedenza ai contratti a tempo indeterminato; full-time da solo non dimostra durata indeterminata. Ordine di priorità VINCOLANTE aggiornato dall'utente il 26 settembre 2026: 1) qualsiasi ruolo pertinente riferito al gaming oppure presso aziende che producono videogiochi; 2) design e tutte le specializzazioni correlate, inclusi UI/UX, product design e design engineering; 3) AI expert e ruoli affini; 4) team manager di sviluppo e ruoli analoghi; 5) solo in fondo frontend senior, frontend manager e affini. Classifica ogni opportunità nella prima categoria applicabile: il settore gaming prevale sul titolo del ruolo. Cerca e valuta le categorie in questo ordine e candidati prima alle opportunità idonee di priorità superiore; passa a quelle inferiori solo dopo aver esaurito le opportunità superiori verificate e candidabili nella sessione. Non riempire la quota con frontend senza aver prima esplorato e documentato le categorie precedenti. Mantieni il vincolo di esperienza documentata anche per gaming, AI e gestione di team; non inventare competenze o responsabilità. Seleziona ruoli coerenti con esperienza documentata in UI/UX, product design, design engineering, frontend React/TypeScript e prodotti/integrazione AI; non inventare competenze, seniority o esperienza con motori di gioco. Verifica limiti geografici del remoto e sede/frequenza dell'ibrido. Non inventare disponibilità al trasferimento, visti, diritto al lavoro, salario o preavviso; segnala eventuali domande obbligatorie non risolvibili. Punta a 20 candidature pertinenti al giorno, massimo 20 invii complessivi per giorno Europe/Rome, senza sacrificare pertinenza per raggiungere la quota. Usa fonti affidabili, confermando annunci aperti e requisiti sul sito carriere ufficiale o ATS collegato dall'azienda. Usa solo contatti recruiting pubblicati, mai indirizzi indovinati. L'utente autorizza invii automatici delle candidature pertinenti con il media kit, esclusivamente dal mittente saccullo.francesco@gmail.com. Verifica l'identità del mittente prima degli invii. Accesso verificato il 24 settembre 2026 a saccullo.francesco@gmail.com nel browser integrato, pagina https://mail.google.com/mail/u/1/#inbox . Il precedente blocco di accesso è risolto. L'indice /u/1/ può cambiare: controlla sempre l'identità del mittente prima di inviare. Se manca l'accesso al mittente corretto, continua ricerca, selezione e preparazione dei testi, segnala il blocco e non dichiarare email inviate. Preferisci il connettore email se disponibile, altrimenti il browser con account corretto. Personalizza testo e lingua per azienda e ruolo usando esclusivamente informazioni documentate. Completa candidature web quando possibile; segnala quelle non eseguibili con link diretto, motivo e passi necessari, senza inventare dati. Non inviare solleciti automatici. Mantieni un registro persistente nella cartella del progetto e consultalo prima di ogni invio per evitare duplicati tra giornate, email e portali. Registra il tentativo prima dell'invio, poi esito e identificativo/conferma. In caso di esito incerto verifica prima di ritentare, senza contarlo come successo. A fine esecuzione produci qui un report in italiano e salvalo nella sottocartella reports: data, aziende/ruoli, fonti e link, motivo di compatibilità, sede e modalità, contratto, canale, sintesi del testo, stato verificato, totale invii riusciti e candidature manuali con istruzioni. Spiega eventuali invii inferiori a 20. Notifica il report di completamento e nuovi blocchi o azioni richieste; resta silenzioso se un blocco già segnalato rimane invariato senza nuova attività. Preferenza vincolante di presentazione aggiornata il 29 settembre 2026: nei testi delle candidature, nel CV e nelle presentazioni usare sempre design al posto di UI/UX e software development al posto di front-end development o formule equivalenti. Presentare un profilo ampio tra design, prodotto, software development e AI, usando esempi documentati nel media kit. Conservare i titoli ufficiali degli annunci nei registri e rispondere con precisione alle domande tecniche specifiche; non inventare competenze o esperienze. Le priorità di ricerca restano invariate."
