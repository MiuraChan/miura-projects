<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEI Codec</title>
  <style>
    :root { color-scheme: dark; font-family: "Courier New", monospace; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #9fffd1;
      background:
        repeating-linear-gradient(0deg, rgba(122, 255, 190, .035) 0 1px, transparent 1px 4px),
        #020605;
    }
    main {
      width: min(34rem, calc(100vw - 3rem));
      padding: 1.4rem;
      border: 1px solid rgba(159, 255, 209, .55);
      box-shadow: 0 0 2rem rgba(69, 255, 164, .12);
    }
    p { margin: .5rem 0 0; line-height: 1.5; }
    .label { font-size: .78rem; letter-spacing: .18em; opacity: .7; }
    .status { font-size: 1rem; }
    .pulse { animation: pulse 1.15s steps(2, end) infinite; }
    .error { color: #ff9d8c; white-space: pre-wrap; overflow-wrap: anywhere; }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="label">MEI // LOCAL CODEC</div>
    <p id="status" class="status pulse">AVVIO DI CERVELLO, VOCE E ASCOLTO…</p>
  </main>
  <script>
    window.showRuntimeError = (message) => {
      const status = document.querySelector("#status");
      status.className = "status error";
      status.textContent = `AVVIO NON RIUSCITO\n${message}\n\nConsulta il file runtime.log nella cartella dati di MEI Codec.`;
    };
  </script>
</body>
</html>
